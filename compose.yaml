# Start models with ./serve.sh up <model> (1 GPU, so one at a time)
name: va

x-vllm: &vllm
  image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.33.0}
  ipc: host
  ulimits: { memlock: -1, stack: 67108864 }
  security_opt: [label=disable]            # Rocky SELinux: read model folders without relabeling
  ports: ["${HOST_BIND:-0.0.0.0}:${HOST_PORT:-8000}:8000"]
  volumes:
    - ${MODELS_DIR:-/data/models}:/models:ro
    - ./configs:/configs:ro
    - ./cache:/root/.cache                 # compile cache -> faster from the second startup
  environment:
    VLLM_API_KEY: ${VLLM_API_KEY:-}
    HF_HUB_OFFLINE: "1"
    VLLM_USE_DEEP_GEMM: "0"                # not supported on SM120 (RTX PRO 6000)
    VLLM_NO_USAGE_STATS: "1"
  deploy:
    resources:
      reservations:
        devices: [{ driver: nvidia, device_ids: ["${GPU_ID:-0}"], capabilities: [gpu] }]
  networks:
    default: { aliases: [vllm] }           # Prometheus scrape address (vllm:8000 for any model)
  restart: unless-stopped

services:
  qwen3.8-27b-fp8:
    <<: *vllm
    profiles: [qwen3.8-27b-fp8, all]
    command: [--model, /models/Qwen3.8-27B-FP8, --config, /configs/qwen3.8-27b-fp8.yaml]
  qwen3.8-27b-nvfp4:
    <<: *vllm
    profiles: [qwen3.8-27b-nvfp4, all]
    command: [--model, /models/Qwen3.8-27B-NVFP4, --config, /configs/qwen3.8-27b-nvfp4.yaml]
  qwen3.6-35b-a3b-fp8:
    <<: *vllm
    profiles: [qwen3.6-35b-a3b-fp8, all]
    command: [--model, /models/Qwen3.6-35B-A3B-FP8, --config, /configs/qwen3.6-35b-a3b-fp8.yaml]
  gemma-4-26b-a4b-it:
    <<: *vllm
    profiles: [gemma-4-26b-a4b-it, all]
    command: [--model, /models/gemma-4-26B-A4B-it, --config, /configs/gemma-4-26b-a4b-it.yaml]
  gemma-4-31b-it-fp8:
    <<: *vllm
    profiles: [gemma-4-31b-it-fp8, all]
    command: [--model, /models/gemma-4-31B-it-FP8-block, --config, /configs/gemma-4-31b-it-fp8.yaml]
  qwen3-coder-30b-a3b-fp8:
    <<: *vllm
    profiles: [qwen3-coder-30b-a3b-fp8, all]
    command: [--model, /models/Qwen3-Coder-30B-A3B-Instruct-FP8, --config, /configs/qwen3-coder-30b-a3b-fp8.yaml]
  qwen3-coder-next-fp8:
    <<: *vllm
    profiles: [qwen3-coder-next-fp8, all]
    command: [--model, /models/Qwen3-Coder-Next-FP8, --config, /configs/qwen3-coder-next-fp8.yaml]
  qwen3.8-27b-fp8-nothink:              # same weights as qwen3.8-27b-fp8, thinking off by default
    <<: *vllm
    profiles: [qwen3.8-27b-fp8-nothink, all]
    command: [--model, /models/Qwen3.8-27B-FP8, --config, /configs/qwen3.8-27b-fp8-nothink.yaml]

  # metrics collection: ./serve.sh monitor up
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=90d]
    volumes: [./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro, prometheus:/prometheus]
    ports: ["127.0.0.1:9090:9090"]
    security_opt: [label=disable]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.1.0
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/vllm.json
    volumes: [./monitoring/grafana:/etc/grafana/provisioning:ro, grafana:/var/lib/grafana]
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    security_opt: [label=disable]
    restart: unless-stopped

volumes:
  prometheus:
  grafana:
