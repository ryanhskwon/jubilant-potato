# Qwen3.8-27B FP8 - thinking, tools, images. Source: vLLM recipe Qwen3.8-27B
served-model-name: qwen3.8-27b-fp8
max-model-len: 262144
kv-cache-dtype: fp8
gpu-memory-utilization: 0.92
max-num-seqs: 16                # loadtest held the targets up to 15 sessions; more requests wait in the queue
max-num-batched-tokens: 16384   # 8192 -> 16384 raised loadtest capacity from 6 to 8 sessions (2026-11-09)
enable-prefix-caching: true
async-scheduling: true
reasoning-parser: qwen3
enable-auto-tool-choice: true
tool-call-parser: qwen3_coder
limit-mm-per-prompt: '{"image": 4, "video": 0}'
speculative-config: '{"method": "mtp", "num_speculative_tokens": 2}'   # 3 -> 2 (2026-11-13): fewer wasted drafts with many users; comment out to turn MTP off
