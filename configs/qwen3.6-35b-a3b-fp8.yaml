# Qwen3.6-35B-A3B FP8 (MoE) - RTX PRO 6000 settings from the recipe + coding sampling from the model card
served-model-name: qwen3.6-35b-a3b-fp8
max-model-len: 262144
kv-cache-dtype: fp8
gpu-memory-utilization: 0.92
max-num-seqs: 64
max-num-batched-tokens: 8192
enable-prefix-caching: true
async-scheduling: true
reasoning-parser: qwen3
enable-auto-tool-choice: true
tool-call-parser: qwen3_coder
limit-mm-per-prompt: '{"image": 4, "video": 0}'
speculative-config: '{"method": "mtp", "num_speculative_tokens": 4, "moe_backend": "flashinfer_cutlass"}'   # delete this line if startup fails
override-generation-config: '{"temperature": 0.6, "top_p": 0.95, "top_k": 20, "presence_penalty": 0.0}'
