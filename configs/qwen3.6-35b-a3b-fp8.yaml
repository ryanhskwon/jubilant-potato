# Qwen3.6-35B-A3B FP8 (MoE) — 레시피의 RTX PRO 6000 설정 + 모델 카드의 코딩용 샘플링
served-model-name: qwen3.6-35b-a3b-fp8
max-model-len: 262144
kv-cache-dtype: fp8
gpu-memory-utilization: 0.92
max-num-seqs: 8
max-num-batched-tokens: 8192
enable-prefix-caching: true
async-scheduling: true
reasoning-parser: qwen3
enable-auto-tool-choice: true
tool-call-parser: qwen3_coder
limit-mm-per-prompt: '{"image": 4, "video": 0}'
speculative-config: '{"method": "mtp", "num_speculative_tokens": 4, "moe_backend": "flashinfer_cutlass"}'   # 기동 실패 시 이 줄 삭제
override-generation-config: '{"temperature": 0.6, "top_p": 0.95, "top_k": 20, "presence_penalty": 0.0}'
